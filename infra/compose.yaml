services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bidhub
      POSTGRES_USER: bidhub
      POSTGRES_PASSWORD: bidhub_local_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["bidhub-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidhub -d bidhub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bidhub-data:
